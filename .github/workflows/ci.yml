name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Symphony.slnx

      - name: Build
        run: dotnet build Symphony.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Symphony.slnx --configuration Release --no-build

      - name: Test Azure Marketplace package
        if: runner.os == 'Linux'
        working-directory: deploy/azure-marketplace
        run: python3 -m unittest -v
