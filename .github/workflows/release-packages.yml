name: release-packages

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Symphony.slnx

      - name: Build
        run: dotnet build Symphony.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Symphony.slnx --configuration Release --no-build

  package:
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
            archive_extension: zip
          - runner: windows-latest
            rid: win-arm64
            archive_extension: zip
          - runner: ubuntu-latest
            rid: linux-x64
            archive_extension: tar.gz
          - runner: ubuntu-latest
            rid: linux-arm64
            archive_extension: tar.gz
          - runner: macos-latest
            rid: osx-x64
            archive_extension: tar.gz
          - runner: macos-latest
            rid: osx-arm64
            archive_extension: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Derive release version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag.StartsWith('v', [System.StringComparison]::OrdinalIgnoreCase)) {
            $tag = $tag.Substring(1)
          }

          if ($tag -notmatch '^(?<prefix>\d+\.\d+\.\d+)(?:-(?<suffix>[0-9A-Za-z\.-]+))?$') {
            throw "Release tag '$tag' must look like v1.2.3 or v1.2.3-rc.1."
          }

          "version=$tag" >> $env:GITHUB_OUTPUT
          "version_prefix=$($Matches.prefix)" >> $env:GITHUB_OUTPUT
          "version_suffix=$($Matches.suffix)" >> $env:GITHUB_OUTPUT

      - name: Restore host project for runtime
        shell: pwsh
        run: dotnet restore src/Symphony.Host/Symphony.Host.csproj --runtime '${{ matrix.rid }}'

      - name: Publish release bundle
        shell: pwsh
        env:
          SYMPHONY_VERSION: ${{ steps.version.outputs.version }}
          SYMPHONY_VERSION_PREFIX: ${{ steps.version.outputs.version_prefix }}
          SYMPHONY_VERSION_SUFFIX: ${{ steps.version.outputs.version_suffix }}
        run: |
          $publishDir = Join-Path $PWD "artifacts/publish/${{ matrix.rid }}"
          $arguments = @(
            'publish',
            'src/Symphony.Host/Symphony.Host.csproj',
            '--configuration', 'Release',
            '--runtime', '${{ matrix.rid }}',
            '--self-contained', 'true',
            '--output', $publishDir,
            "-p:Version=$env:SYMPHONY_VERSION",
            "-p:VersionPrefix=$env:SYMPHONY_VERSION_PREFIX",
            "-p:InformationalVersion=$env:SYMPHONY_VERSION"
          )

          if ([string]::IsNullOrWhiteSpace($env:SYMPHONY_VERSION_SUFFIX)) {
            $arguments += '-p:VersionSuffix='
          }
          else {
            $arguments += "-p:VersionSuffix=$env:SYMPHONY_VERSION_SUFFIX"
          }

          dotnet @arguments

          if ($IsLinux -or $IsMacOS) {
            chmod +x (Join-Path $publishDir 'Symphony')
            chmod +x (Join-Path $publishDir 'setup-symphony.sh')
          }

      - name: Archive release bundle
        id: archive
        shell: pwsh
        env:
          SYMPHONY_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $publishDir = Join-Path $PWD "artifacts/publish/${{ matrix.rid }}"
          $archiveBaseName = "Symphony-$env:SYMPHONY_VERSION-${{ matrix.rid }}"
          $releaseDir = Join-Path $PWD 'artifacts/release'
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

          if ('${{ matrix.archive_extension }}' -eq 'zip') {
            $archivePath = Join-Path $releaseDir "$archiveBaseName.zip"
            if (Test-Path $archivePath) {
              Remove-Item $archivePath -Force
            }

            Compress-Archive -Path (Join-Path $publishDir '*') -DestinationPath $archivePath
          }
          else {
            $archivePath = Join-Path $releaseDir "$archiveBaseName.tar.gz"
            tar -czf $archivePath -C $publishDir .
          }

          $hash = (Get-FileHash -Path $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = "$archivePath.sha256"
          Set-Content -Path $checksumPath -Value "$hash *$(Split-Path $archivePath -Leaf)"

          "archive_path=$archivePath" >> $env:GITHUB_OUTPUT
          "checksum_path=$checksumPath" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.rid }}
          path: |
            ${{ steps.archive.outputs.archive_path }}
            ${{ steps.archive.outputs.checksum_path }}

  publish-container:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build, verify and push the release container
        id: image
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ && ${#RELEASE_TAG} -le 128 ]]
          repository="ghcr.io/${GITHUB_REPOSITORY,,}-marketplace"
          tagged="$repository:$RELEASE_TAG"
          docker build --platform linux/amd64 --tag "$tagged" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$RELEASE_TAG" .
          bash deploy/container/smoke-test.sh "$tagged"

          signed_in=$(mktemp -d)
          anonymous=$(mktemp -d)
          trap 'rm -rf -- "$signed_in" "$anonymous"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker --config "$signed_in" login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          unset GHCR_TOKEN
          docker --config "$signed_in" push "$tagged"
          ref=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$tagged" |
            awk -v repo="$repository" 'index($0, repo "@sha256:") == 1 {print}')
          [[ "${ref#"$repository"@}" =~ ^sha256:[0-9a-f]{64}$ ]]
          # Send no GitHub credentials. Verify the registry serves the exact
          # manifest to an anonymous pull token before creating a public ZIP.
          if ! pull_token=$(curl -fsS --get 'https://ghcr.io/token' \
            --data-urlencode 'service=ghcr.io' \
            --data-urlencode "scope=repository:${repository#ghcr.io/}:pull" | jq -er '.token') ||
            ! curl -fsS --head \
              -H "Authorization: Bearer $pull_token" \
              -H 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/${repository#ghcr.io/}/manifests/${ref##*@}" > /dev/null; then
            echo '::error::The Azure VM needs an anonymously pullable image. Check the GHCR package visibility and rerun. The Marketplace ZIP was not published.'
            exit 1
          fi
          docker --config "$anonymous" pull --platform linux/amd64 "$ref"
          bash deploy/container/smoke-test.sh "$ref"
          printf 'image=%s\n' "$ref" >> "$GITHUB_OUTPUT"

  package-azure-marketplace:
    needs: [validate, publish-container]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test Azure Marketplace package
        working-directory: deploy/azure-marketplace
        run: python3 -m unittest -v

      - name: Build Azure Marketplace package
        env:
          SYMPHONY_IMAGE: ${{ needs.publish-container.outputs.image }}
        run: |
          python3 deploy/azure-marketplace/package.py --out artifacts/marketplace --symphony-image "${SYMPHONY_IMAGE:?Missing published image digest}"
          printf '%s\n' "$SYMPHONY_IMAGE" > artifacts/marketplace/symphony-container-image.txt
          cd artifacts/marketplace
          sha256sum symphony-marketplace.zip > symphony-marketplace.zip.sha256

      - name: Upload Azure Marketplace ZIP
        uses: actions/upload-artifact@v4
        with:
          name: package-azure-marketplace
          path: |
            artifacts/marketplace/symphony-marketplace.zip
            artifacts/marketplace/symphony-marketplace.zip.sha256
            artifacts/marketplace/symphony-container-image.txt
          if-no-files-found: error

  publish-release:
    permissions:
      contents: write
    needs: [package, package-azure-marketplace]
    runs-on: ubuntu-latest

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: release-assets

      - name: Attach archives to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: release-assets/*
